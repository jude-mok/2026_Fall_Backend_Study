[project]
name = "likelion-backend-study"
version = "0.1.0"
description = "FastAPI backend for the 2026 Fall LikeLion backend study"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.116.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.0,<3.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
